name: GroomReady static checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'tests/**'
      - '.github/workflows/groomready-static.yml'
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Node and run tests
        run: |
          node --version
          node --check app.js
          node --test tests/*.test.cjs
