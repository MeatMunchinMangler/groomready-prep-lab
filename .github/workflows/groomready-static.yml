name: GroomReady static checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'tests/**'
      - '.github/workflows/groomready-static.yml'
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Node and run tests
        run: |
          node --version
          node --check app.js
          node --test tests/*.test.cjs
      - name: Install pinned browser test tooling
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Chromium mobile-first interaction proof
        run: node tests/browser_share.cjs
      - name: Verify isolated public validation deployment
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 20 https://groomready-validation-20261113.vercel.app/ -o /tmp/groomready-home.html
          curl --fail --silent --show-error --location --retry 3 --max-time 20 https://groomready-validation-20261113.vercel.app/app.js -o /tmp/groomready-app.js
          grep -Fq 'GroomReady · Appointment prep' /tmp/groomready-home.html
          grep -Fq 'id="sharetool"' /tmp/groomready-home.html
          grep -Fq 'function cleanLandingUrl' /tmp/groomready-app.js
          ! grep -Fq 'Log in to Vercel' /tmp/groomready-home.html
          echo "Public validation URL serves GroomReady, not an authentication wall"
